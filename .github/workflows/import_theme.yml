name: Import theme

on:
  workflow_dispatch:
    inputs:
      brandId:
        description: 'Brand ID'
        required: true
      branchName:
        description: 'Branch Name'
        required: true
        type: choice
        options:
          - main
          - sandbox
      scriptBranch:
        description: 'Run scripts from'
        required: true
        default: 'master'

jobs:
  import_theme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branchName }}

      - name: Check out importTheme.js
        uses: Bhacaz/checkout-files@v2
        with:
          files: '.github/workflows/scripts/importTheme.js'
          branch: ${{ github.event.inputs.scriptBranch }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Zip theme files
        run: |
          zip -r theme.zip . -x ".*"
          mv theme.zip ./.github/workflows/scripts/

      - name: Run importTheme.js
        run: node ./.github/workflows/scripts/importTheme.js ${{ github.event.inputs.brandId }} ./.github/workflows/scripts/theme.zip
        env:
          ZENDESK_SUBDOMAIN: ${{ github.event.inputs.branchName == 'sandbox' && secrets.SANDBOX_DOMAIN || secrets.ZENDESK_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_TOKEN: ${{ github.event.inputs.branchName == 'sandbox' && secrets.SANDBOX_TOKEN || secrets.ZENDESK_TOKEN }}

      - name: Upload theme file
        uses: actions/upload-artifact@v4
        with:
          name: theme-file
          path: ./.github/workflows/scripts/theme.zip