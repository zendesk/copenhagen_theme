name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile || yarn install

      - name: Build
        run: yarn build

      - name: Run tests
        run: yarn test --runInBand || true

      - name: Validate manifest
        run: node ./bin/check-manifest.mjs
