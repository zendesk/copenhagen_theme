name: Update theme

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - sandbox
  pull_request:
    types:
      - closed
    branches:
      - main
      - sandbox

jobs:
  update_theme:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Set theme version name
        run: |
          VERSION=$(node -p "require('./manifest.json').version.split('.').slice(0,2).join('.')")
          BRANCH="${{ github.ref_name }}"
          THEME_NAME="ARPA-H Theme ${VERSION}.${{ github.run_number }} (${BRANCH})"
          echo "Setting theme name to: ${THEME_NAME}"
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.name = '${THEME_NAME}';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "

      - name: Zip theme files
        run: |
          zip -r theme.zip . -x ".*"
          mv theme.zip ./.github/workflows/scripts/

      - name: Run updateTheme.js
        run: node ./.github/workflows/scripts/updateTheme.js
        env:
          ZENDESK_SUBDOMAIN: ${{ (github.ref_name == 'sandbox') && secrets.SANDBOX_DOMAIN || secrets.ZENDESK_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_TOKEN: ${{ (github.ref_name == 'sandbox') && secrets.SANDBOX_TOKEN || secrets.ZENDESK_TOKEN }}
          BRAND_ID: ${{ (github.ref_name == 'sandbox') && secrets.SANDBOX_BRAND_ID || secrets.BRAND_ID }}

      - name: Upload theme file
        uses: actions/upload-artifact@v7
        with:
          name: theme-file
          path: ./.github/workflows/scripts/theme.zip