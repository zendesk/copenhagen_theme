name: Update theme

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - sandbox
    paths-ignore:
      - '.github/**'
      - '**.md'
      - 'LICENSE'
      - 'bin/**'
      - '__mocks__/**'
      - 'jest.config.mjs'
      - 'jest.setup.js'
      - 'src/**/*.test.ts'
      - 'src/**/*.test.tsx'
      - 'src/**/*.spec.ts'
      - 'src/**/*.spec.tsx'
  pull_request:
    types:
      - closed
    branches:
      - main
      - sandbox
    paths-ignore:
      - '.github/**'
      - '**.md'
      - 'LICENSE'
      - 'bin/**'
      - '__mocks__/**'
      - 'jest.config.mjs'
      - 'jest.setup.js'
      - 'src/**/*.test.ts'
      - 'src/**/*.test.tsx'
      - 'src/**/*.spec.ts'
      - 'src/**/*.spec.tsx'

permissions:
  contents: read

concurrency:
  group: update-theme-${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  update_theme:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build theme assets
        run: yarn build

      - name: Set theme version name
        run: |
          VERSION=$(node -p "require('./manifest.json').version.split('.').slice(0,2).join('.')")
          BRANCH="${TARGET_BRANCH}"
          THEME_NAME="ARPA-H Theme ${VERSION}.${{ github.run_number }} (${BRANCH})"
          echo "Setting theme name to: ${THEME_NAME}"
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.name = '${THEME_NAME}';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "

      - name: Zip theme files
        run: |
          zip -r theme.zip . -x ".*" -x "node_modules/*"
          mv theme.zip ./.github/workflows/scripts/

      - name: Run updateTheme.js
        run: node ./.github/workflows/scripts/updateTheme.js
        env:
          ZENDESK_SUBDOMAIN: ${{ (env.TARGET_BRANCH == 'sandbox') && secrets.SANDBOX_DOMAIN || secrets.ZENDESK_SUBDOMAIN }}
          ZENDESK_EMAIL: ${{ secrets.ZENDESK_EMAIL }}
          ZENDESK_TOKEN: ${{ (env.TARGET_BRANCH == 'sandbox') && secrets.SANDBOX_TOKEN || secrets.ZENDESK_TOKEN }}
          BRAND_ID: ${{ (env.TARGET_BRANCH == 'sandbox') && vars.SANDBOX_BRAND_ID || vars.BRAND_ID }}

      - name: Upload theme file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: theme-file
          path: ./.github/workflows/scripts/theme.zip