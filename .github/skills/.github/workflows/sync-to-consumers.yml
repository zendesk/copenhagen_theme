# Runs when skills/main changes, or on demand via workflow_dispatch.
# Clones each registered consumer repo, adds or updates the skills subtree
# at the configured prefix, and pushes the result.
#
# Adding a new consumer: update .github/subtree-consumers.json and trigger
# this workflow manually — no manual git commands needed in the consumer repo.
#
# Prerequisites:
#   - SKILLS_SUBTREE_SYNC_APP_ID secret: the GitHub App's client ID (shown on the app's settings page)
#   - SKILLS_SUBTREE_SYNC_PRIVATE_KEY secret: the GitHub App's private key (.pem file contents)
#   The app must be installed on this repo and every consumer repo listed in
#   .github/subtree-consumers.json, with Contents: Read & write permission.

name: Sync to subtree consumers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      consumer:
        description: 'Specific consumer repo to sync (e.g. ARPA-H/designator). Leave blank to sync all.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  load-consumers:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: read
        env:
          FILTER: ${{ inputs.consumer }}
        run: |
          if [ -n "$FILTER" ]; then
            echo "matrix=$(jq -c --arg r "$FILTER" '{consumer: [.[] | select(.repo == $r)]}' .github/subtree-consumers.json)" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(jq -c '{consumer: .}' .github/subtree-consumers.json)" >> "$GITHUB_OUTPUT"
          fi

  sync:
    name: Sync → ${{ matrix.consumer.repo }}
    needs: load-consumers
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.load-consumers.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ secrets.SKILLS_SUBTREE_SYNC_APP_ID }}
          private-key: ${{ secrets.SKILLS_SUBTREE_SYNC_PRIVATE_KEY }}
          owner: ARPA-H

      - name: Clone consumer and add or update subtree
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CONSUMER_REPO: ${{ matrix.consumer.repo }}
          PREFIX: ${{ matrix.consumer.prefix }}
          BRANCH: ${{ matrix.consumer.branch }}
          SKILLS_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -e
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Configure credential helper so the token is used for all git operations
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

          git clone \
            "https://github.com/${CONSUMER_REPO}.git" \
            consumer-repo

          cd consumer-repo
          BEFORE=$(git rev-parse HEAD)

          if [ -d "${PREFIX}" ]; then
            # Prefix already exists — update the subtree.
            # --message is intentionally omitted: git subtree appends a git-subtree-split:
            # trailer to the merge commit that it uses as the merge base on the next pull.
            # Passing --message replaces the entire message and strips that trailer, causing
            # spurious conflicts on every subsequent sync.
            git subtree pull \
              --prefix="${PREFIX}" \
              "${SKILLS_URL}" \
              main \
              --squash
          else
            # First time — add the subtree.
            git subtree add \
              --prefix="${PREFIX}" \
              "${SKILLS_URL}" \
              main \
              --squash
          fi

          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" != "$AFTER" ]; then
            git push origin HEAD:"${BRANCH}"
            echo "Synced to ${CONSUMER_REPO}:${PREFIX}"
          else
            echo "Already up to date in ${CONSUMER_REPO}:${PREFIX}"
          fi
